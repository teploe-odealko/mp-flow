name: mpflow-standalone

services:
  postgres:
    image: postgres:17-alpine
    container_name: mpflow-standalone-db
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-mpflow_local}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-mpflow_local_2026}
      POSTGRES_DB: ${LOCAL_DB_NAME:-mpflow_local}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - ./tmp/postgres-standalone:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-mpflow_local} -d ${LOCAL_DB_NAME:-mpflow_local}"]
      interval: 5s
      timeout: 3s
      retries: 10
