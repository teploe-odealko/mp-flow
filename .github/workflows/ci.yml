name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mpflow
          POSTGRES_PASSWORD: mpflow_ci
          POSTGRES_DB: mpflow
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mpflow -d mpflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Production readiness tests
        run: npx vitest run tests/integration/prod-readiness.test.ts

      - name: Postgres runtime tests
        env:
          RUN_POSTGRES_TESTS: "1"
          TEST_DATABASE_URL: postgresql://mpflow:mpflow_ci@127.0.0.1:5432/mpflow
        run: npm run test:postgres

      - name: Build
        run: npm run build

      - name: Production startup smoke
        env:
          NODE_ENV: production
          ACCOUNTING_PERSISTENCE: postgres
          DATABASE_URL: postgresql://mpflow:mpflow_ci@127.0.0.1:5432/mpflow
          ACCOUNTING_ENCRYPTION_KEY: ci-smoke-encryption-key
          BETTER_AUTH_SECRET: ci-smoke-better-auth-secret
          HOST: 127.0.0.1
          PORT: 4110
        run: |
          npm run start > /tmp/mpflow.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4110/api/health/ready >/dev/null; then
              exit 0
            fi
            kill -0 $SERVER_PID 2>/dev/null || break
            sleep 2
          done
          cat /tmp/mpflow.log
          exit 1
